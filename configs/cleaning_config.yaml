# ============================================================
# cleaning_config.yaml - 数据清洗配置
# ============================================================
# 6阶段数据清洗流水线配置
# 采集(00) → 数据清洗(00.5) → 预处理(01)
# ============================================================

# ========== 全局配置 ==========
global:
  # 输入目录（原始音频，散列存储）
  input_dir: "data/00_raw_collect/raw_audio"
  # 输出目录（清洗后音频）
  output_dir: "data/00.5_cleaned/cleaned_audio"
  # 拒绝目录（不合格音频）
  rejected_dir: "data/00.5_cleaned/rejected"
  # 报告目录（清洗报告）
  report_dir: "data/00.5_cleaned/reports"
  # 音频清单
  manifest_csv: "data/00_raw_collect/audio_manifest.csv"
  # 并行处理数
  num_workers: 4
  # 日志级别
  log_level: "INFO"

  # ========== YAMNet 音频事件检测（默认开启，比规则兜底快12-20倍且更准）==========
  # YAMNet 在独立 conda 环境 yamnet_env 中运行，主环境通过 subprocess 调用
  # 输出 CSV/Parquet，主环境只读结果，不 import tensorflow
  yamnet:
    enabled: true  # 默认开启，全都跑 YAMNet
    # yamnet_env conda 环境名
    conda_env: "yamnet_env"
    # conda 初始化脚本路径（Mac miniconda）
    conda_init_script: "/opt/miniconda3/etc/profile.d/conda.sh"
    # YAMNet 推理脚本路径
    infer_script: "scripts/00.5_cleaning/yamnet_infer.py"
    # 输入列表文件（由主环境生成，每行 track_id,path）
    input_list: "data/00.5_cleaned/reports/yamnet_input_list.csv"
    # 输出文件（CSV 或 Parquet，主环境只读）
    output_file: "data/00.5_cleaned/reports/yamnet_output.csv"
    # 帧级置信度阈值
    confidence_threshold: 0.3
    # 非音乐判定逻辑
    non_music_detection:
      # YAMNet is_music=False 且 has_speech=True → 非音乐（语音/播客）
      reject_speech: true
      # YAMNet is_music=False 且 has_noise=True → 非音乐（环境音/噪声）
      reject_noise: true
      # 人声占比阈值（vocals_ratio_estimate > 此值标记为有人声，用于后续 Demucs 决策）
      vocal_threshold: 0.1

  # ========== 规则兜底（可选快速预筛选，默认关闭）==========
  # 规则兜底比 YAMNet 慢且准确率低，仅用于快速预筛选明显非音乐
  # 如<3秒短音频、全静音等，减少 YAMNet 处理量
  rule_based_filter:
    enabled: false  # 默认关闭，全都跑 YAMNet
    # 静音占比 > 此值标记为非音乐
    max_silence_ratio: 0.7
    # 时长 < 此值（秒）标记为非音乐
    min_duration: 3.0
    # 文件名含非音乐关键词标记为非音乐
    non_music_keywords:
      - "speech"
      - "interview"
      - "podcast"
      - "lecture"
      - "语音"
      - "访谈"
      - "播客"
      - "噪声"
      - "静音"
      - "环境音"
    # 频谱平坦度 > 此值标记为非音乐（持续噪声/环境音）
    max_spectral_flatness: 0.5

# ========== Stage 1: 元数据清洗 ==========
stage1_metadata:
  enabled: true
  # 字段标准化
  field_standardization:
    # GM128 乐器标准化
    instrument_standardization: true
    # VAD 情绪标准化
    emotion_standardization: true
    # 三级流派标准化
    genre_standardization: true
  # 缺失值处理
  missing_value:
    # 策略：skip / fill_default / flag
    strategy: "flag"
    # 默认填充值
    defaults:
      instrument: "unknown"
      emotion: "unknown"
      genre: "unknown"
  # 冲突消解
  conflict_resolution:
    # 策略：first / last / majority / manual
    strategy: "first"
  # 无效样本剔除
  invalid_filter:
    # 缺少必填字段的样本是否剔除
    remove_missing_required: false
    # 必填字段
    required_fields: ["audio_id", "file_relative_path"]

# ========== Stage 2: 格式标准化 ==========
stage2_format:
  enabled: true
  # 目标格式
  target_format: "wav"  # wav / flac
  # 目标采样率
  target_sample_rate: 44100  # 44100 / 48000
  # 目标位深
  target_bit_depth: 16  # 16 / 24
  # 目标声道
  target_channels: 2  # 1=mono, 2=stereo
  # 允许的源格式
  allowed_source_formats: ["wav", "flac", "mp3", "ogg", "m4a"]
  # 不支持的格式直接拒绝
  reject_unsupported: true
  # 降噪配置（可选，默认关闭）
  noise_reduction:
    enabled: false  # 是否启用降噪
    strength: 0.5   # 降噪强度 0.0-1.0，0.5为中等
    stationary: true  # 是否为稳态噪声（持续的背景噪声）

# ========== Stage 3: 音频质量清洗 ==========
stage3_quality:
  enabled: true
  # 损坏检测
  corruption_detection:
    enabled: true
    # 无法解码的文件直接拒绝
    reject_corrupted: true
  # 静音过滤
  silence_filter:
    enabled: true
    # 静音阈值（RMS < 此值视为静音）
    silence_threshold: 0.001
    # 硬门槛：完全静音（>99%静音）直接剔除
    complete_silence_ratio: 0.99
    # 软标记：静音占比高只警告不剔除（有前奏/间奏的音乐可能静音占比高）
    warning_silence_ratio: 0.7
  # 音质门槛
  quality_threshold:
    enabled: true
    # 最低采样率
    min_sample_rate: 44100
    # 最低位深
    min_bit_depth: 16
    # 硬门槛：削波>5%直接剔除（原1%太严格，正常音乐偶尔有削波）
    max_clipping_ratio: 0.05
    # 软标记：SNR偏低只警告不剔除（压缩过的流行音乐SNR常在15-20dB）
    warning_snr: 15
    # 软标记：动态范围低只警告不剔除（响度战争后流行音乐DR常在10-20dB）
    warning_dynamic_range: 10
    # 时长过滤（硬门槛）
    min_duration: 5  # 最短5秒，过短直接剔除
    max_duration: 0  # 0表示不设上限（视任务调整）
  # 内容过滤
  content_filter:
    enabled: true  # 默认开启，YAMNet 作为主要检测方式（比规则兜底快12-20倍且更准）
    # 非音乐内容过滤（YAMNet is_music=False 且 has_speech/has_noise=True 时剔除）
    filter_non_music: true
    # 人声占比过滤
    max_vocal_ratio: 1.0
    # 文本安全检测（关键词/NLP，对元数据文本字段，不需要ASR）
    text_safety:
      enabled: false  # 默认关闭，需要时开启
      # 需要检测的文本列（只检测实际存在的列）
      text_columns:
        - "description"
        - "lyrics"
        - "comments"
        - "notes"
        - "title"
        - "artist"
      # 风险阈值，超过此值判定为不安全
      risk_threshold: 0.5
      # 是否自动过滤不安全样本（默认只标记不删除）
      filter_unsafe: false
      # 关键词分类（可自定义覆盖默认）
      # keyword_categories:
      #   violence:
      #     weight: 0.8
      #     keywords: ["暴力", "血腥", "自残"]
      #   drugs:
      #     weight: 0.9
      #     keywords: ["毒品", "吸毒"]
  # 响度归一化
  loudness_normalization:
    enabled: true
    # 目标响度 (LUFS)
    target_lufs: -14
    # 真峰值上限 (dBTP)
    true_peak_max: -1
    # 允许的偏差 (LU)
    tolerance: 0.5

# ========== Stage 4: 多级去重 ==========
stage4_dedup:
  enabled: true
  # 精确去重
  exact_dedup:
    enabled: true
    # 使用 checksum 文件
    use_checksum: true
    # checksum 文件路径
    checksum_csv: "data/00_raw_collect/raw_audio_checksums.csv"
    # 策略：keep_first / keep_last / keep_highest_quality
    strategy: "keep_first"
  # 近似去重
  approximate_dedup:
    enabled: false  # 需要 Chromaprint/fpcalc，默认关闭
    # 相似度阈值
    similarity_threshold: 0.9
    # 方法：chromaprint / chroma_cosine
    method: "chromaprint"
  # 片段级去重
  segment_dedup:
    enabled: false
    # 滑动窗口大小 (秒)
    window_size: 10
    # 步长 (秒)
    hop_size: 5
  # 跨集泄露防控
  cross_set_leakage:
    enabled: false
    # 数据集划分文件
    split_csv: ""

# ========== Stage 5: 辅助清洗 ==========
stage5_auxiliary:
  enabled: true  # 高级功能，默认关闭
  # 风格一致性聚类
  style_clustering:
    enabled: false  # 需要MERT，Mac本地内存不足，用GPU跑
    # 聚类方法：kmeans / dbscan
    method: "kmeans"
    # 聚类数
    n_clusters: 10
  # 语言过滤
  # 语言过滤（Whisper base detect_language，Mac CPU 可跑）
  language_filter:
    enabled: true
    # Whisper 模型大小（语言检测用 base 足够，~150MB，CPU 可跑）
    model_size: "base"
    # 运行设备（cpu/cuda）
    device: "cpu"
    # 允许的语言列表（不在列表中的标记为 lang_allowed=false）
    allowed_languages: ["zh", "en", "ja"]
    # 最低置信度（低于此值标记 low_confidence）
    min_confidence: 0.3
    # 最多检测多少秒音频（30秒足够判断语言，速度快）
    max_seconds: 30
    # 是否自动过滤非目标语言（false=只标记不删除，true=直接剔除）
    filter_not_allowed: false
  # PII 移除
  pii_removal:
    enabled: true
    # 需要清理 PII 的文本列（只清理实际存在的列）
    text_columns:
      - "description"
      - "lyrics"
      - "comments"
      - "notes"
      - "title"
      - "artist"
    # 启用的 PII 类型
    enabled_types:
      - "phone"           # 手机号
      - "id_card"         # 身份证
      - "email"           # 邮箱
      - "bank_card"       # 银行卡
      - "landline"        # 固定电话
      - "ip_address"      # IP地址
      - "url"             # URL
      - "mac_address"     # MAC地址
      - "chinese_address" # 中文地址
    # 姓名检测（误报率高，默认关闭）
    enable_name_detection: false
    # 替换符
    replacement: "[REDACTED]"

# ========== Stage 6: 预处理输出 ==========
stage6_output:
  enabled: true
  # 重采样 & 声道处理
  resample:
    enabled: true
    target_sample_rate: 44100
    target_channels: 2
  # 分块
  chunking:
    enabled: true  # 默认不开启，按需开启
    # 块大小 (秒)
    chunk_size: 30
    # 重叠比例 (0-1)
    overlap_ratio: 0.5
    # 最小块长度 (秒)
    min_chunk_length: 5
  # 特征提取
  feature_extraction:
    enabled: true  # 使用独立的 extract_features.py
    # 特征类型
    features: ["mel", "cqt", "chroma", "mfcc"]
