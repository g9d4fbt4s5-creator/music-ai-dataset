# ============================================================
# environment_gpu.yml - AutoDL GPU 服务器环境（music-corpus-gpu）
# ============================================================
# 用法：
#   conda env create -f environment_gpu.yml
#   conda activate music-corpus-gpu
#
# GPU 环境职责：仅负责重计算任务
# - 音频预处理（重采样、响度归一、切片）
# - demucs 源分离
# - MERT / CLAP 大模型推理
# - 轻量特征提取（librosa/madmom-onnx，如需要）
#
# 模型权重位置（GPU 本地，不需要搬到 Mac）：
# - CLAP: /root/autodl-tmp/models/clap_fusion/
# - MERT: /root/autodl-tmp/models/mert/ (已下载 1.6GB)
#
# 不包含（本地 Mac 负责）：
# - essentia 特征提取
# - label-studio 人工标注
# ============================================================

name: music-corpus-gpu

channels:
  - conda-forge
  - defaults

dependencies:
  # ---------- Python 基础 ----------
  - python=3.11
  - pip
  - setuptools
  - wheel

  # ---------- 深度学习框架（GPU 版本） ----------
  # AutoDL 镜像通常自带 CUDA + PyTorch，这里兜底指定版本
  - pytorch=2.2.2
  - torchaudio=2.2.2
  - cudatoolkit=12.1

  # ---------- 数据处理 ----------
  - numpy=1.26.4
  - scipy=1.13.0
  - scikit-learn=1.9.0
  - pandas
  - pyyaml
  - tqdm

  # ---------- 音频处理基础 ----------
  - ffmpeg=4.3.2

  # ---------- pip 安装的包 ----------
  - pip:
      # 深度学习框架（如果 conda 安装失败，pip 兜底）
      - torch==2.2.2
      - torchaudio==2.2.2
      - transformers==4.40.2

      # 音频模型
      - laion_clap==1.1.7
      - demucs==3.0.6
      - torchcrepe==0.0.24

      # 音频处理（轻量特征提取，GPU 端可选）
      - librosa
      - madmom-onnx==0.17.dev0
      - pyloudnorm

      # 云存储
      - boto3
      - oss2

      # 新架构依赖
      - python-ulid

      # 工具
      - black
      - isort
